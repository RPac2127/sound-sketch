  const timing = {
    duration: 700,
    iterations: Infinity
  }

  let anims = []

  function setup_frames () {
    frames.forEach((skel, i) => {
      skel.css('position', 'absolute')
      skel.css('left', dance_sequence[i].x + 'px')
      skel.css('top', dance_sequence[i].y + 'px')
      skel.css('display', 'none')
    })
  }

  function start_animation () {
    if (anims.length > 0) return

    frames.forEach((skel, i) => {
      const start = i / frames.length
      const end = (i + 1) / frames.length

      skel.css('display', 'block')

      const keyframes = [{
          visibility: 'hidden',
          offset: 0
        },
        {
          visibility: 'hidden',
          offset: start
        },
        {
          visibility: 'visible',
          offset: start
        },
        {
          visibility: 'visible',
          offset: end
        },
        {
          visibility: 'hidden',
          offset: end
        },
        {
          visibility: 'hidden',
          offset: 1
        }
      ]

      anims.push(skel.animate(keyframes, timing))
    })
  }

  function stop_animation () {
    anims.forEach(a => a.cancel())
    anims = []
    frames.forEach(skel => skel.css('display', 'none'))
  }

  function on_key (e) {

    }
  }


  nn.on('keydown', on_key)
